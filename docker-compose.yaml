services:
  subtitle-fetcher:
    build: .
    container_name: subtitle-fetcher
    ports:
      # Map host port 8080 to container port 8080
      - "8080:8080"
    environment:
      # The application will read this environment variable
      - PORT=8080
      # Tells the application to store its database here instead of the binary directory
      - DB_PATH=/app/data
      # Optional: auto-scan interval (e.g. 30m, 1h). Scans for new files and fetches
      # missing subtitles. Useful for NAS/SMB mounts where inotify does not work.
      # - AUTO_SCAN_INTERVAL=30m
    volumes:
      # Bind mount the directory to serve.
      # Replace "/mnt/z/Shared/Downloads" with the actual path you want to scan/serve.
      - /mnt/z/Shared/Downloads:/media
      
      # Bind mount a local folder to persist the SQLite database and settings
      - ./data:/app/data
    restart: unless-stopped
