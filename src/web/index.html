<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtitle Fetcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Subtitle Fetcher</h1>
  <div class="header-actions">
    <button id="btn-auto-imdb" class="primary">Auto IMDB</button>
    <button id="btn-scan" class="primary">⟳ Scan</button>
    <button id="btn-settings-gear">⚙ Settings</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tab-library">Library</div>
  <div class="tab" id="tab-settings">Settings</div>
</div>

<main>
  <!-- Library tab -->
  <div id="panel-library">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <div class="search-wrap">
        <input id="search" type="text" placeholder="Search…">
        <button id="search-clear" class="search-clear hidden">✕</button>
      </div>
      <div class="filter-groups">
        <div class="filter-group">
          <span class="filter-label">Type</span>
          <div class="pills" data-filter="type">
            <button class="pill active" data-value="">All</button>
            <button class="pill" data-value="movie">Movies</button>
            <button class="pill" data-value="series">Series</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Status</span>
          <div class="pills" data-filter="status">
            <button class="pill active" data-value="">All</button>
            <button class="pill" data-value="complete">Complete</button>
            <button class="pill" data-value="partial">Partial</button>
            <button class="pill" data-value="missing">Missing</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">IMDB</span>
          <div class="pills" data-filter="imdb">
            <button class="pill active" data-value="">All</button>
            <button class="pill" data-value="yes">With IMDB</button>
            <button class="pill" data-value="no">No IMDB</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Sort</span>
          <div class="pills" data-filter="sort">
            <button class="pill active" data-value="">Default</button>
            <button class="pill" data-value="name">Name</button>
            <button class="pill" data-value="coverage">Coverage</button>
            <button class="pill" data-value="type">Type</button>
          </div>
        </div>
      </div>
    </div>
    <div class="media-list" id="media-list"></div>
  </div>

  <!-- Settings tab -->
  <div id="panel-settings" class="hidden">
    <div id="settings-panel">
      <div id="provider-list"></div>
      <button class="primary save-all-btn">Save all</button>

      <div class="section-divider"></div>
      <h2 style="margin:0 0 8px;font-size:15px;">Export / Import</h2>
      <p style="color:var(--muted);font-size:12px;margin-bottom:14px;">
        Export saves all provider settings and IMDB IDs. Import matches by media name and skips unknowns.
      </p>
      <div style="display:flex;gap:10px">
        <button id="btn-export">Export</button>
        <label class="btn-import-label">
          Import
          <input type="file" id="import-file-input" accept=".json" style="display:none">
        </label>
      </div>
      <div id="import-result"></div>
    </div>
  </div>
</main>

<div id="toast-container"></div>

<div id="imdb-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <span id="imdb-modal-title">Set IMDB ID</span>
      <button class="modal-close" onclick="window.closeImdbPicker()">✕</button>
    </div>
    <div style="padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0">
      <input id="imdb-search-input" type="text" placeholder="Search title…"
        style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;outline:none"
        oninput="window.onImdbSearchInput(this.value)">
    </div>
    <div id="imdb-picker-body" style="overflow-y:auto;max-height:55vh"></div>
  </div>
</div>

<div id="picker-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <span id="picker-title">Choose Subtitle</span>
      <button class="modal-close" onclick="window.closePicker()">✕</button>
    </div>
    <div style="padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0">
      <input id="picker-search-input" type="text" placeholder="Search title or subtitle name…"
        style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;outline:none"
        oninput="window.onPickerSearchInput(this.value)">
    </div>
    <div class="picker-cols">
      <span>Provider</span><span>Language</span><span>Release</span><span style="text-align:right">Downloads</span><span>Format</span>
    </div>
    <div id="picker-body" style="overflow-y:auto;max-height:55vh"></div>
    <div id="picker-status" class="modal-status" style="display:none"></div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
