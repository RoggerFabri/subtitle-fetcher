name: subtitle-fetcher-amd64
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - 'README.md'
      - 'TODO.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - 'docker-compose.yaml'
      - '.github/**'
  push:
    branches:
      - "main"
    paths-ignore:
      - 'README.md'
      - 'TODO.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - 'docker-compose.yaml'
      - '.github/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract Go version from go.mod
        id: go-version
        run: echo "version=$(grep -oP '^go \K[0-9.]+' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true
      - name: Run tests
        run: go test -v ./...

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract Go version from go.mod
        id: go-version
        run: echo "version=$(grep -oP '^go \K[0-9.]+' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true

      - name: Build AMD64 binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-w -s" -o dist/subtitle-fetcher ./src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: ./Dockerfile.prebuilt
          platforms: linux/amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          provenance: true
          sbom: true
          tags: |
            ${{ secrets.DOCKERHUB_SLUG }}/subtitle-fetcher:amd64-latest
            ${{ secrets.DOCKERHUB_SLUG }}/subtitle-fetcher:amd64-${{github.run_number}}
